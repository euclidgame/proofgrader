      - marking_scheme
      - solution
  
  break_into_steps_and_grade:
    name: "Break into Steps and Grade"
    description: "Evaluation template that breaks the proof into steps and grades each step"
    template: |
      You are an EXPERT MATHEMATICAL-PROOF ANALYST. Your task is to decompose a given proof into its atomic logical steps, formatted as a Markdown Table.

      **CORE INSTRUCTION:**

      * **Faithful Decomposition**: Decompose the PROPOSED SOLUTION precisely as it is written.
      * **No Error Correction**: If a step in the proof is invalid or fallacious, record the step as presented in the proof (including its claimed dependencies and likely category). Your role is to map the argument, not to validate or correct it.
      * **First-Person Perspective**: Adopt the perspective of the proof's author. Avoid any third-person commentary or quoting (e.g., do not use phrases like "The proof then states...").
      * **Problem Statement Integration**: Incorporate all relevant information from the PROBLEM STATEMENT as initial steps in your decomposition, typically as Premise or Definition entries.

      ---

      ### ATOMIC STEP DEFINITION & CATEGORIES
      An *atomic step* is the smallest possible logical step in the proof. Each step must

      * express a single, coherent mathematical assertion, and
      * have an positive integer as its ID, and
      * be tagged with **one** of these four categories:  
        - **Premise**: An initial assertion taken as true. This includes givens from the problem statement, explicit assumptions for case analysis or contradiction (e.g., "Assume $P$..." or "Case 1: $n$ is even"), or globally established assumptions. Verbal cues: "Let...", "Suppose...", "Assume...".
        - **Definition**: Introduction of notation, new objects, or recall of existing definitions. Examples: "Define (S = {{x \in \mathbb{{R}} \mid x > 0}})", "Let $n = 2k$", "Recall that a group is...".
        - **Deduction**: Any step derived from preceding steps or established mathematical knowledge. This includes logical inferences, algebraic manipulations, application of theorems, axiom invocation. Examples: "By Theorem X...", "Therefore, $a < c$", "Thus $n^2$ is even".
        - **Conclusion**: A statement that finalizes a segment of the proof (e.g., completes a lemma, resolves a case, confirms a contradiction) or the entire proof. Verbal cues: "Thus, the statement holds", "This is a contradiction", "Q.E.D.".

      ---

      ### MARKER COLUMN (Conditional Use)
      Use *only* when you open or close a temporary assumption or lemma.

      | Marker value    | Meaning |
      |-----------------|---------------|
      | `assume`        | Marks the introduction of a local assumption (e.g., "Assume P" or "Lemma X asserts..." or "Case 1: [condition]").    |
      | `contradiction` | Marks the conclusion of the most recent `assume` scope due to a contradiction. |
      | `lemma-end`     | Marks the conclusion of the most recent `assume` scope upon proving a lemma.      |
      | `case-end`      | Marks the conclusion of a specific case within a case analysis. |

      Leave the **Marker** column blank for all other steps.

      ---

      ### DEPENDS_ON COLUMN
      List a comma-separated sequence of IDs corresponding to the immediate prerequisite steps that directly justify the current step, as implied or stated in the proof. 
      Leave blank when the parent is obvious or none is needed (Premises, Definitions, routine algebra).  
      A step is an immediate prerequisite if the current step cannot be justified without it, and there are no intermediate steps in the proof's logic between the prerequisite and the current step that also convey that same justifying information.

      ---

      ### OUTPUT FORMAT  
      Produce **nothing** except the table block shown below.

      ### ATOMIC_STEPS
      | ID | Assertion | Category | Marker | Depends_On |
      |----|-----------|----------|--------|------------|
      **TABLE COLUMN RULES:**
      - **ID**: Sequential integers `1, 2, 3,...`. Steps must be presented in a valid topological order reflecting the proof's flow.
      - **Assertion**: The precise statement of the step as made in (or implied by) the proof, using LaTeX for math and wrap math formulas in dollar signs.
      - **Category**: Exactly one of: `Premise`, `Definition`, `Deduction`, `Conclusion`.
      - **Marker**: `assume`, `contradiction`, `lemma-end`, or blank.
      - **Depends_On**: A comma-separated list of `ID`s for the *immediate* prerequisite steps that the proof uses (or implies) to justify this step (e.g., `1,3`). Leave blank if the step (e.g., a Premise) depends on no prior steps.

      Note that use $\mid$ instead of "|" in latex equations to avoid confusing it with Markdown’s table column separators.

      After the final row **do not** add explanations, analysis, or extra text.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

    variables:
      - problem
      - solution
  
  with_marking_scheme_and_break_into_steps:
    name: "With Marking Scheme and Break into Steps"
    description: "Evaluation template that breaks the proof into steps and grades each step"
    template: |
      You are an **expert math proof grader**. You will evaluate a proof using its **atomic steps**, and a **problem-specific marking scheme** (0–7). **Follow the marking scheme exactly.**

      ### Inputs

      * **Problem Statement:**
        {problem}
      * **Marking Scheme:**
        {marking_scheme}
      * **Original Proof Solution (verbatim):**
        {solution}
      * **ATOMIC STEPS (table):**
        {steps}

      ### How to use ATOMIC STEPS (internal only; do NOT reference step IDs in the output)

      1. Integrity check: Ensure topological order (each Depends_On references earlier IDs). If violated, rely on the Original Proof to assess whether the reasoning exists; do not penalize for extraction errors.
      2. Reasoning trace: Internally verify that the conclusion is supported by a coherent chain (Premise/Definition → Deduction → Conclusion). If ATOMIC_STEPS are unreliable, reconstruct coherence from the Original Proof.
      3. **Markers:**
        * `assume`: must be discharged (e.g., contradiction).
        * `contradiction`: ensure an actual contradiction follows and conclude the correct negation.
        * `lemma-end`: consider it a sub-result boundary.
      4. **Map to checkpoints:** For each checkpoint in the **Marking Scheme**, check if the proof (as captured by ATOMIC\_STEPS) substantively satisfies it. Respect all rules:

        * **\[additive]**: award all applicable items.
        * **\[max k]**: award up to **k** total in that bullet/group.
        * **“award the larger only”**: if mutually exclusive, give only the larger value.
        * For **parallel chains** or a **catch-all** checkpoint: choose the valid path yielding the **highest** score without double-counting.
      5. **Zero-credit & deductions:**

        * Do not award points for listed **zero-credit** items.
        * Apply **at most one** deduction (the **largest**) or **cap** exactly as specified. Never reduce below 0.
      6. **Final-answer consistency:** If the reference solution has a definitive final answer, the student’s final answer must match (or be equivalent) to earn conclusion credit.

      ### Output (JSON only)

      Return **only** a JSON object with this structure. Do **not** include ATOMIC step IDs anywhere in the JSON.

      ```json
      {{
        "score": 4,
        "assessment": "Main idea aligns with the reference approach and reaches the correct conclusion; one required justification is missing, costing a major checkpoint.",
        "score_breakdown": {{
          "checkpoints_awarded": [
            {{"checkpoint": "Establish invariant I [additive]", "points": 2}},
            {{"checkpoint": "Derive key inequality (Lemma 1) [max 2]", "points": 2}}
          ],
          "deduction_or_cap": {{"rule": "none", "value": 0}},
          "final": 4
        }},
        "errors": [
          "Missing justification for the monotonicity claim before applying the inequality.",
          "One arithmetic slip that does not affect validity."
        ]
      }}
      ```

      ### Constraints

      * Checkpoint awards must respect `[additive]`, `[max k]`, and exclusivity rules and sum to **≤ 7** before deductions/caps.
      * Keep `errors` as **plain, concise bullets** without quoting or referencing step numbers.

    variables:
      - problem
      - marking_scheme
      - solution
      - steps
  
  critic_reflection:
    name: "Critic Reflection"
    description: "Critique an initial evaluation report against the original proof"
    template: |
      You are an expert meta-evaluator. Your task is to review an earlier evaluation report for a proof solution. Your goal is to detect weaknesses and improve grading quality. You will be given the instructions that the initial evaluation report is based on, the inputs to the initial evaluation report, and the initial evaluation report itself.

      ## What you must do
      1) Independently re-verify the proof against the marking scheme (0–7). The prior report is a hint, not ground truth.
      2) You may change the score **up or down** only if you can cite NEW, scheme-backed evidence relative to the initial report, e.g.:
        • a previously overlooked checkpoint that the proof actually satisfies;
        • an over-penalization not warranted by the scheme (remove it);
        • a valid alternative method correctly mapped to equivalent checkpoints;
        • a misapplied fatal cap (or a newly identified fatal condition).
        If no new evidence exists, KEEP the prior score.
        If |Δscore| ≥ 2, provide at least TWO concrete new pieces of evidence.
      3) Scheme-first, advisory use:
        • Map valid alternatives to equivalent checkpoints; do not penalize order/technique differences unless forbidden.
        • Apply deductions only when the scheme’s conditions actually hold; avoid double counting.
        • Apply fatal caps exactly if triggered.
        • Give conservative partial credit for under-justified steps and say what is missing.

      ### Output Format

      Respond with **only** well-formed XML using the structure below. Do not include any extra text or Markdown.

      **Requirements:**
      - `<score>` must be an integer in [0, 7].
      - `<assessment>` must be a **detailed analysis** that explains your reasoning step-by-step and provides a clear **rationale for the score**. Reference specific claims/lines if present. Include the scoring breakdown **in prose** here (earned checkpoints or mapped equivalents, deductions, and subtotal → final score).
      - `<errors>` must be a list of specific issues (empty if score = 7).

      Example output:

      <score>0</score>
      <assessment>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes...</assessment>
      <errors>
        1. specific error 1,
        2. specific error 2,
        ...
      </errors>

      ## Instructions

      Here are the instructions that the initial evaluation report is based on:
      -----------------------Begin of Instructions-----------------------------------
      You are an **expert math proof grader**. You are judging the correctness of an LLM-generated proof for a math problem.

      ### Input

      Your input will consist of:

      * **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      * **Reference Solution**: A correct solution or proof provided for reference. This is **not necessarily the only valid solution**. If the problem requires a final numeric or algebraic answer, this section contains the correct answer, which should be the only accepted final answer (though alternative reasoning paths are valid).
      * **Marking Scheme**: A problem-specific grading rubric (0–7 scale) with checkpoints, zero-credit items, and deductions. **Treat this scheme as advisory guidance, not a script.** Use it to anchor scoring, but **do not require** the proof to follow the same order, lemmas, or technique if its reasoning is mathematically sound.
      * **Proof Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.

      ### Task

      Analyze the proof carefully.

      **Core principles (in order of precedence):**
      1) **Mathematical validity** of the proof’s reasoning and conclusion.
      2) **Problem constraints** (e.g., unique required final value; forbidden tools if stated).
      3) **Advisory mapping to the marking scheme** (checkpoints/deductions), allowing different orders and techniques.
      4) **Reference solution** as an anchor for sufficiency, not exclusivity.

      **Alternative-approach policy:**
      - If the proof uses a different but valid method, **map its steps to equivalent rubric checkpoints** (same logical role) and award points accordingly.
      - **Do not penalize** solely for re-ordering steps, using different lemmas, or giving a correct shortcut, **unless** the problem forbids it.
      - Apply zero-credit items/deductions **only when the underlying issue actually occurs** in the given proof’s approach; **do not auto-penalize** for omitting a rubric step that is unnecessary under the alternative method.
      - Avoid double-counting mutually exclusive items; if two items solve the same logical gap, **award the larger only**.
      - If the final numeric/algebraic answer is wrong where uniqueness is required, award only partial credit justified by correct intermediate reasoning.

      **Rigor and evidence:**
      - Award credit for intermediate claims **only if adequately justified** within the proof (not merely asserted).
      - If a step is plausible but under-justified, award **conservative partial credit** and note what is missing.

      **What to produce:**
      - Identify logical errors, incorrect steps, or unclear reasoning.
      - Give a **score between 0 and 7** with a **detailed assessment**.
      - **Within the assessment text**, show clearly how the score was derived:
        - Which rubric checkpoints (or their **mapped equivalents**) were earned and the points you awarded.
        - Any zero-credit items or deductions you applied (and why).
        - How these add up to the final integer score in [0–7].
      -----------------------End of Instructions-----------------------------------

      ### Inputs
      * Problem Statement:
        {problem}
      * Reference Solution:
        {human_solution}
      * Marking Scheme (scoring rubric, 0–7 scale):
        {marking_scheme}
      * Proof Solution:
        {solution}
      * Initial Evaluation Report (XML or prose):
        {initial_report}

    variables:
      - problem
      - solution
      - human_solution
      - marking_scheme
      - initial_report

