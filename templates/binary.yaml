templates:
  binary_basic_evaluation:
    name: "Evaluation"
    description: "Evaluation a given proof"
    template: |
      You are an expert math proof grader. You are judging the correctness of an LLM-generated proof for a math problem.

      ## Input:
      Your input will consist of the following components:
      - **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      - **Model Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.

      ## Judging Criteria:
      Your task is to decide whether the solution is **correct (1)** or **incorrect (0)**.
      - Mark the proof as **correct (1)** if it fully solves the problem with logically sound reasoning, even if there are minor issues such as:
        - Small computational mistakes that do not affect the overall validity of the proof.
        - Minor omissions of steps that are immediately obvious and require little reasoning or manual work.
        - Slightly incomplete handling of an edge case, provided the main argument still works.
      - Mark the proof as **incorrect (0)** if it contains any serious flaw, such as:
        - Claiming a step is “trivial” when it is not immediately obvious why it holds.
        - Skipping algebra-heavy or nontrivial computational steps.
        - Generalizing a pattern without rigorously proving its properties.
        - Citing a non-existent or obscure theorem (anything that cannot be quickly verified in a reliable source such as Wikipedia).
        - Any logical gap that undermines the correctness of the argument.
      
      **Important:** The model has been explicitly instructed not to skip steps or label them as trivial. If it does so, assume it cannot justify the step, and mark the solution as incorrect.

      ## Output format:
      Give a score 0 if the proof is incorrect, and a score 1 if the proof is correct.

      Respond with this XML format (no extra text should be included):

      <score>0</score>
      <assessment>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes.</assessment>
      <errors>
        explanation of error 1
        explanation of error 2
        ...
      </errors>

      - score must be either 0 or 1.
      - assessment is a short summary of the evaluation.
      - errors is a list of specific issues (empty if score = 1).

      ==================================================

      **Problem Statement:**
      {problem}

      **Model Solution:**
      {solution}

    variables:
      - problem
      - solution
  
  binary_with_reference_solution:
    name: "With Reference Solution"
    description: "Evaluation template with reference solution"
    template: |
      You are an expert math proof grader. You are judging the correctness of an LLM-generated proof for a math problem.

      ## Input

      You will be given:

      * **Problem Statement**: A mathematical problem that the proof attempts to solve.
      * **Reference Solution**: A correct proof written by humans. This is provided to help you understand the expected reasoning, but the model solution does not need to match it word-for-word. Any logically valid alternative approach is also acceptable. However, if the problem explicitly requires a final numeric or symbolic answer, the model solution must match the reference solution’s final answer.
      * **Model Solution**: The proof you need to evaluate. This proof may contain errors, omissions, or unclear steps.


      ## Grading Guidelines

      Your task is to decide whether the solution is **correct (1)** or **incorrect (0)**.

      * Mark the proof as **correct (1)** if:

        * The final numeric or symbolic answer (if the problem explicitly requires one) is **mathematically equivalent to the reference solution’s final answer**.
        * The reasoning is logically sound and leads to the correct result.
        * The argument is either consistent with the reference solution **or** provides a different but valid line of reasoning.
        * Minor mistakes (e.g., small computational slips, trivial skipped steps, or slightly incomplete handling of edge cases) do not undermine the overall correctness.

      * Mark the proof as **incorrect (0)** if:

        * The final numeric or symbolic answer (if the problem explicitly requires one) is **not mathematically equivalent to the reference solution’s final answer**.
        * It contains a logical flaw that prevents the conclusion from being established.
        * It skips or hand-waves nontrivial steps.
        * It generalizes without justification.
        * It relies on non-existent or obscure theorems.
        * The reasoning is inconsistent with mathematics, even if it superficially resembles the reference solution.

      **Important**: The model has been explicitly instructed not to skip steps or label them as trivial. If it does so, assume it cannot justify the step, and mark the solution as incorrect.

      ## Output Format

      Respond with this XML format (no extra text should be included):
      <score>0</score>
      <assessment>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes.</assessment>
      <errors>
        explanation of error 1
        explanation of error 2
        ...
      </errors>

      * **score** must be either `0` or `1`.
      * **assessment** should summarize the evaluation.
      * **errors** should list issues (empty if score = 1).

      ==================================================

      **Problem Statement:**
      {problem}

      **Reference Solution:**
      {human_solution}

      **Model Solution:**
      {solution}

    variables:
      - problem
      - human_solution
      - solution

  with_reference_solution_after_model_solution:
    name: "With Reference Solution After Model Solution"
    description: "Evaluation template with reference solution after model solution"
    template: |
      You are an expert math proof grader. You are judging the correctness of an LLM-generated proof for a math problem.

      ## Input

      You will be given:

      * **Problem Statement**: A mathematical problem that the proof attempts to solve.
      * **Model Solution**: The proof you need to evaluate. This proof may contain errors, omissions, or unclear steps.
      * **Reference Solution**: A correct proof written by humans. This is provided to help you understand the expected reasoning, but the model solution does not need to match it word-for-word. Any logically valid alternative approach is also acceptable. However, if the problem explicitly requires a final numeric or symbolic answer, the model solution must match the reference solution’s final answer.


      ## Grading Guidelines

      Your task is to decide whether the solution is **correct (1)** or **incorrect (0)**.

      * Mark the proof as **correct (1)** if:

        * The final numeric or symbolic answer (if the problem explicitly requires one) is **mathematically equivalent to the reference solution’s final answer**.
        * The reasoning is logically sound and leads to the correct result.
        * The argument is either consistent with the reference solution **or** provides a different but valid line of reasoning.
        * Minor mistakes (e.g., small computational slips, trivial skipped steps, or slightly incomplete handling of edge cases) do not undermine the overall correctness.

      * Mark the proof as **incorrect (0)** if:

        * The final numeric or symbolic answer (if the problem explicitly requires one) is **not mathematically equivalent to the reference solution’s final answer**.
        * It contains a logical flaw that prevents the conclusion from being established.
        * It skips or hand-waves nontrivial steps.
        * It generalizes without justification.
        * It relies on non-existent or obscure theorems.
        * The reasoning is inconsistent with mathematics, even if it superficially resembles the reference solution.

      **Important**: The model has been explicitly instructed not to skip steps or label them as trivial. If it does so, assume it cannot justify the step, and mark the solution as incorrect.

      ## Output Format

      Respond with a JSON object in this format:

      ```json
      {{
        "score": 0,
        "assessment": "Concise explanation of why the proof is correct or incorrect.",
        "errors": [
          "Brief description of error 1 (if any)",
          "Brief description of error 2 (if any)"
        ]
      }}
      ```

      * **score** must be either `0` or `1`.
      * **assessment** should summarize the evaluation.
      * **errors** should list issues (empty if score = 1).

      ==================================================

      **Problem Statement:**
      {problem}

      **Model Solution:**
      {solution}

      **Reference Solution:**
      {human_solution}

    variables:
      - problem
      - solution
      - human_solution

  with_atomic_steps:
    name: "With Atomic Steps"
    description: "Evaluation template with atomic steps"
    template: |
      You are an **expert math proof grader**. You will evaluate a proof using its **atomic steps**. The atomic steps are original proof broken down into smaller steps by another language model to help you understand the dependencies between the steps.

      ### Inputs

      * **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      * **Original Proof Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.
      * **ATOMIC STEPS**: The atomic steps of the proof.
      
      ### How to use ATOMIC STEPS (internal only; do NOT reference step IDs in the output)

      1. Integrity check: Ensure topological order (each Depends_On references earlier IDs). If violated, rely on the Original Proof to assess whether the reasoning exists; do not penalize for extraction errors.
      2. Reasoning trace: Internally verify that the conclusion is supported by a coherent chain (Premise/Definition → Deduction → Conclusion). If ATOMIC_STEPS are unreliable, reconstruct coherence from the Original Proof.
      3. **Markers:**
        * `assume`: must be discharged (e.g., contradiction).
        * `contradiction`: ensure an actual contradiction follows and conclude the correct negation.
        * `lemma-end`: consider it a sub-result boundary.

      ### Output

      Give a score 0 if the proof is incorrect, and a score 1 if the proof is correct.

      Return exactly these XML tags with no extra text before or after:

      <score>0</score>
      <analysis>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes.</analysis>

      - <score> must be either 0 or 1.
      - <analysis> should be a concise rationale; list key errors if score = 0.
      
      ==================================================

      **Problem Statement:**
      {problem}

      **Original Proof Solution:**
      {solution}

      **ATOMIC STEPS:**
      {steps}

    variables:
      - problem
      - solution
      - steps

  break_into_steps:
    name: "Break into Steps and Grade"
    description: "Evaluation template that breaks the proof into steps and grades each step"
    template: |
      You are an EXPERT MATHEMATICAL-PROOF ANALYST. Your task is to decompose a given proof into its atomic logical steps, formatted as a Markdown Table.

      **CORE INSTRUCTION:**

      * **Faithful Decomposition**: Decompose the PROPOSED SOLUTION precisely as it is written.
      * **No Error Correction**: If a step in the proof is invalid or fallacious, record the step as presented in the proof (including its claimed dependencies and likely category). Your role is to map the argument, not to validate or correct it.
      * **First-Person Perspective**: Adopt the perspective of the proof's author. Avoid any third-person commentary or quoting (e.g., do not use phrases like "The proof then states...").
      * **Problem Statement Integration**: Incorporate all relevant information from the PROBLEM STATEMENT as initial steps in your decomposition, typically as Premise or Definition entries.

      ---

      ### ATOMIC STEP DEFINITION & CATEGORIES
      An *atomic step* is the smallest possible logical step in the proof. Each step must

      * express a single, coherent mathematical assertion, and
      * have an positive integer as its ID, and
      * be tagged with **one** of these four categories:  
        - **Premise**: An initial assertion taken as true. This includes givens from the problem statement, explicit assumptions for case analysis or contradiction (e.g., "Assume $P$..." or "Case 1: $n$ is even"), or globally established assumptions. Verbal cues: "Let...", "Suppose...", "Assume...".
        - **Definition**: Introduction of notation, new objects, or recall of existing definitions. Examples: "Define (S = {{x \in \mathbb{{R}} \mid x > 0}})", "Let $n = 2k$", "Recall that a group is...".
        - **Deduction**: Any step derived from preceding steps or established mathematical knowledge. This includes logical inferences, algebraic manipulations, application of theorems, axiom invocation. Examples: "By Theorem X...", "Therefore, $a < c$", "Thus $n^2$ is even".
        - **Conclusion**: A statement that finalizes a segment of the proof (e.g., completes a lemma, resolves a case, confirms a contradiction) or the entire proof. Verbal cues: "Thus, the statement holds", "This is a contradiction", "Q.E.D.".

      ---

      ### MARKER COLUMN (Conditional Use)
      Use *only* when you open or close a temporary assumption or lemma.

      | Marker value    | Meaning |
      |-----------------|---------------|
      | `assume`        | Marks the introduction of a local assumption (e.g., "Assume P" or "Lemma X asserts..." or "Case 1: [condition]").    |
      | `contradiction` | Marks the conclusion of the most recent `assume` scope due to a contradiction. |
      | `lemma-end`     | Marks the conclusion of the most recent `assume` scope upon proving a lemma.      |
      | `case-end`      | Marks the conclusion of a specific case within a case analysis. |

      Leave the **Marker** column blank for all other steps.

      ---

      ### DEPENDS_ON COLUMN
      List a comma-separated sequence of IDs corresponding to the immediate prerequisite steps that directly justify the current step, as implied or stated in the proof. 
      Leave blank when the parent is obvious or none is needed (Premises, Definitions, routine algebra).  
      A step is an immediate prerequisite if the current step cannot be justified without it, and there are no intermediate steps in the proof's logic between the prerequisite and the current step that also convey that same justifying information.

      ---

      ### OUTPUT FORMAT  
      Produce **nothing** except the table block shown below.

      ### ATOMIC_STEPS
      | ID | Assertion | Category | Marker | Depends_On |
      |----|-----------|----------|--------|------------|
      **TABLE COLUMN RULES:**
      - **ID**: Sequential integers `1, 2, 3,...`. Steps must be presented in a valid topological order reflecting the proof's flow.
      - **Assertion**: The precise statement of the step as made in (or implied by) the proof, using LaTeX for math and wrap math formulas in dollar signs.
      - **Category**: Exactly one of: `Premise`, `Definition`, `Deduction`, `Conclusion`.
      - **Marker**: `assume`, `contradiction`, `lemma-end`, or blank.
      - **Depends_On**: A comma-separated list of `ID`s for the *immediate* prerequisite steps that the proof uses (or implies) to justify this step (e.g., `1,3`). Leave blank if the step (e.g., a Premise) depends on no prior steps.

      Note that use $\mid$ instead of "|" in latex equations to avoid confusing it with Markdown’s table column separators.

      After the final row **do not** add explanations, analysis, or extra text.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

    variables:
      - problem
      - solution

settings:
  default_template: "evaluation"
  max_template_length: 64000
  required_variables: ["problem", "solution"]