    description: "Evaluation template with reference solution and marking scheme"
    template: |
      You are an **expert math proof grader**. You are judging the correctness of an LLM-generated proof for a math problem.

      ### Input

      Your input will consist of:

      * **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      * **Reference Solution**: A correct solution or proof provided for reference. This is **not necessarily the only valid solution**. If the problem requires a final numeric or algebraic answer, this section contains the correct answer, which should be the only accepted final answer (though alternative reasoning paths are valid).
      * **Marking Scheme**: A problem-specific grading rubric (0–7 scale) with checkpoints, zero-credit items, and deductions. You must follow this scheme when assigning points.
      * **Proof Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.

      ### Task

      Analyze the proof carefully.

      * Compare the proof against the reference solution and the marking scheme.
      * Award points according to the marking scheme’s checkpoints, zero-credit items, and deductions.
      * Identify logical errors, incorrect steps, or unclear reasoning.
      * Give a score between 0 and 7 with a brief overall assessment.
      * Show clearly how the score was derived: 
        * Which checkpoints were earned (with awarded points).
        * Any zero-credit items or deductions applied.
        * How the subtotal leads to the final score (0–7).

      ### Output Format

      Respond with **only** well-formed XML using the structure below. Do not include any extra text or Markdown.

      **Requirements:**
      - `<score>` must be an integer in [0, 7].
      - `<assessment>` must be a **detailed analysis** that explains your reasoning step-by-step and provides a clear **rationale for the score**. Reference specific claims/lines if present.
      - `<errors>` must be a list of specific issues (empty if score = 7).

      Example output:

      <score>0</score>
      <assessment>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes...</assessment>
      <errors>
        1. specific error 1,
        2. specific error 2,
        ...
      </errors>

      ----------------------------------------------------------
      **Problem Statement**
      {problem}

      **Reference Solution**
      {human_solution}

      **Marking Scheme**
      {marking_scheme}

      **Proof Solution**
      {solution}
    
    variables:
      - problem
      - human_solution
      - marking_scheme
      - solution
  
  with_reference_solution_and_marking_scheme_v3:
    name: "With Reference Solution and Marking Scheme (v3)"
    description: "Evaluation template with reference solution and marking scheme (v3)"
    template: |
      MATH-PROOF GRADER  v3   —  EXECUTION PROTOCOL
      ═════════════════════════════════════════════
      The assistant receives ONE text bundle containing, **in this order and with visible headings**, the four parts

        1. Problem Statement
        2. Reference Solution        (official, 100 % correct)
        3. Marking Scheme            (check-points CP1 …  total 0–7 pts,
                                      plus any “zero-credit / cap / deduction” rules)
        4. Proof Solution            (the script that must be graded)

      The assistant must output a SINGLE well-formed XML fragment that contains **exactly three root tags in the order**

          <score>k</score>
          <assessment> … </assessment>
          <errors> … </errors>

      Nothing—absolutely nothing—may precede, follow or sit outside those three tags.  Do **not** wrap them or fence them in Markdown. The XML must parse.

      Allowed characters inside tags: printable UTF-8 plus line-breaks.
      Raw “<” and “&” are forbidden; use “&lt;” and “&amp;”.

      k is an integer 0 – 7 (no sign, no spaces, no decimal).
      If and only if k = 7, leave the tag empty: <errors></errors>

      The tag bodies:

      <score>k</score>.
      <assessment>
      • Treat every checkpoint CPi from the Marking Scheme **in order**.
      • State whether it is satisfied / partly / not satisfied.
      • Quote or unambiguously point to the relevant line(s) of the Proof Solution for every point you award.
      • Show the individual points earned: “… (+2)”.
      • Maintain and display running subtotals, caps, deductions, zero-credit triggers exactly as the scheme prescribes:
            Subtotal = 5
            Deductions: −1 for trigger Z1  → 4
            Cap at 3?  Not triggered.
            Final = 4 / 7
      • Put “(+0)” for unsatisfied CPs.
      • The arithmetic must reach the final integer that appears in
      </assessment>
      <errors>
      Up to six numbered, concise mathematical faults spotted in the Proof Solution (logical gaps, false claims, missing cases …).
      </errors>

      ──────────────────────────────────────────────────────────────────────
      GRADING PRINCIPLES  (follow to the letter)
      ──────────────────────────────────────────────────────────────────────
      A. Literal reading
        • Award points ONLY as allocated in the scheme.
        • Do NOT invent extra checkpoints.
        • If the scheme imposes a cap or mandatory zero, enforce it even if later work is flawless.

      B. Evidence based
        • A mere assertion (“obvious”, “clearly”) earns 0 when proof is required.
        • A correct final answer never retro-earns earlier CPs unless the scheme says so.

      C. Dependency
        • A fatal error at CPi invalidates all later CPj that logically rely on it unless the scheme states independence.
        • If the scheme marks a CP as independent, judge it on its own.

      D. Alternative correct methods
        • Accept any rigorously valid argument that establishes the specific
          result demanded by a CP.

      E. Partial credit & arithmetic
        • Follow the exact point splits given (e.g. “first bullet 1 pt, second bullet 2 pts”).
        • If only part is proven, award only that part.

      F. Incorrect final answer
        • Obey any explicit “0 if wrong answer” clause; otherwise mark only the dedicated CP for the final result as 0 and continue.

      G. Strict but fair
        • When unsure, withhold the point.
        • Ignore stylistic issues unless clarity or format is an explicit CP.

      ──────────────────────────────────────────────────────────────────────
      FREQUENT TECHNICAL PITFALLS  –  CHECK BEFORE SCORING
      ──────────────────────────────────────────────────────────────────────
      • Induction missing the inductive step ⇒ 0.
      • Injective ⇒ monotone is false without continuity.
      • “Circle powers equal” must be proven, not quoted.
      • Inequality chains: check arrow directions.
      • Combinatorial bijections must cover every stated case.
      • Coordinate proofs must actually solve for the critical point(s), not merely assert existence.
      • When a student uses an alternative route, verify that every CP requirement has still been met.

      ──────────────────────────────────────────────────────────────────────
      MINI-CHECKLIST BEFORE EMITTING THE XML
      ──────────────────────────────────────────────────────────────────────
      ✓ Exactly three root tags, in the correct order.  
      ✓ Integer 0-7 inside <score>.  
      ✓ <assessment> lists every CP, shows points, running totals, caps.  
      ✓ <errors> empty ⇔ score = 7.  
      ✓ No extra tags or markdown fences.  
      ✓ No naked “<” or “&”.  
      ✓ Arithmetic consistent with <score>.  
      ✓ Output parses as XML.

      A response that breaks any of the above format rules is **summarily rejected by the autograder**.

      ----------------------------------------------------------
      **Problem Statement**
      {problem}

      **Reference Solution**
      {human_solution}

      **Marking Scheme**
      {marking_scheme}

      **Proof Solution**
      {solution}

    variables:
      - problem
      - human_solution
      - marking_scheme
      - solution

