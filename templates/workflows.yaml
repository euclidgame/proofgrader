settings:
  max_template_length: 100000

templates:
  step1_binary_check:
    name: "Two-Step: Binary Correctness Check"
    description: "Step 1: Decide if the proof is fully correct (binary)."
    template: |
      You are an expert math proof grader. You are judging the correctness of an LLM-generated proof for a math problem.

      ## Input:
      Your input will consist of the following components:
      - **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      - **Model Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.

      ## Judging Criteria:
      Your task is to decide whether the solution is **correct (1)** or **incorrect (0)**.
      - Mark the proof as **correct (1)** if it fully solves the problem with logically sound reasoning, even if there are minor issues such as:
        - Small computational mistakes that do not affect the overall validity of the proof.
        - Minor omissions of steps that are immediately obvious and require little reasoning or manual work.
        - Slightly incomplete handling of an edge case, provided the main argument still works.
      - Mark the proof as **incorrect (0)** if it contains any serious flaw, such as:
        - Claiming a step is “trivial” when it is not immediately obvious why it holds.
        - Skipping algebra-heavy or nontrivial computational steps.
        - Generalizing a pattern without rigorously proving its properties.
        - Citing a non-existent or obscure theorem (anything that cannot be quickly verified in a reliable source such as Wikipedia).
        - Any logical gap that undermines the correctness of the argument.
      
      **Important:** The model has been explicitly instructed not to skip steps or label them as trivial. If it does so, assume it cannot justify the step, and mark the solution as incorrect.

      ## Output format:
      Give a score 0 if the proof is incorrect, and a score 1 if the proof is correct.

      Respond with this XML format (no extra text should be included):

      <score>0</score>
      <errors>list specific issues separated by newlines</errors>

      -----------------------------
      Problem:
      {problem}

      Proof Solution:
      {solution}

    variables:
      - problem
      - solution

  step2_partial_scoring:
    name: "Two-Step: Partial Scoring with Scheme (conditioned on Step 1)"
    description: "Step 2: If Step 1=1, check only minor deductions; else, award partial credits using errors + scheme."
    template: |
      You are an expert math proof grader evaluating an LLM-generated proof.

      ## Inputs:
      - Problem Statement — the problem to solve.
      - Reference Solution — an authoritative solution (not the only valid approach). If a unique numeric/algebraic answer is required, this contains the correct final answer.
      - Marking Scheme — a problem-specific rubric (0–7) with checkpoints, zero-credit items, deductions, and any fatal caps. Treat as advisory guidance, not a script: different valid methods may map to equivalent checkpoints.
      - Proof Solution — the candidate proof (may contain errors/omissions).
      - Preliminary Verdict (reliable but fallible; hints only)
        - precheck_verdict ∈ {{0,1}}: 1 = “generally correct; at most minor issues”, 0 = “has major issues”
        - precheck_flags: issues flagged by the precheck (may include false positives/negatives)

      ## Task
      Give a final grading to the proof solution based on the proof solution, marking scheme, and preliminary verdict. Verify the solution against the marking scheme, using precheck_* as hints.

      ## Use of the Preliminary Verdict
      - If precheck_verdict=1: scan all checkpoints and fatal conditions. If none apply, award 7; otherwise apply only scheme-mandated minor deductions (and any fatal cap).
      - If precheck_verdict=0: investigate precheck_flags, but deduct only when the scheme’s conditions are met; award partial credit checkpoint-by-checkpoint.

      ## Alternative-approach policy
      - Map valid alternative steps to equivalent rubric checkpoints.
      - Apply zero-credit/deductions only when the issue occurs in this approach; do not auto-penalize for rubric steps unnecessary under an alternative method.
      - Avoid double-counting mutually exclusive items; if two items cover the same gap, apply only the larger.
      - If a unique final answer is wrong, award partial credit for justified intermediate reasoning.

      **Rigor and evidence:**
      - Award credit for intermediate claims **only if adequately justified** within the proof (not merely asserted).
      - If a step is plausible but under-justified, award **conservative partial credit** and note what is missing.
    
      ## Output Format
      Give an integer score between 0 and 7.
      Respond with this XML format (no extra text should be included):
      <score>0</score>
      <assessment>explanations of why the score was derived</assessment>

      -----------------------------
      Problem:
      {problem}

      Reference Solution:
      {human_solution}

      Marking Scheme:
      {marking_scheme}

      Proof Solution:
      {solution}

      Preliminary Verdict:
      - precheck_verdict: {precheck_verdict}
      - precheck_flags: {precheck_flags}

    variables:
      - problem
      - human_solution
      - marking_scheme
      - solution
      - precheck_verdict
      - precheck_flags


